<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机游戏昵称生成器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>随机游戏昵称生成器</h1>
        <div class="nickname-display">
            <div id="nickname">点击按钮生成昵称</div>
            <div id="loading" class="loading hidden">生成中...</div>
        </div>
        <div class="buttons">
            <button id="generate-btn">生成昵称</button>
            <button id="copy-btn">复制到剪贴板</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
