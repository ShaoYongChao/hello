<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TouchScale - 屏幕电子秤</title>
    <link rel="apple-touch-icon" sizes="180x180" href="https://touchscale.ml.mk/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://touchscale.ml.mk/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://touchscale.ml.mk/favicon-16x16.png">
    <link rel="manifest" href="https://touchscale.ml.mk/site.webmanifest">
    <style>
        * {
            font-family: 'San Francisco Text', sans-serif;
            -webkit-user-select: none;
        }
        
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            box-sizing: border-box;
        }
        
        #container {
            width: 100%;
            max-width: 415px;
            height: 100vh;
            margin: 0 auto;
            position: relative;
            border-top: 20px solid #76D0F3;
            box-sizing: border-box;
            background-color: white;
            overflow: hidden;
            /* 为底部安全区域预留空间 */
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        #footer {
            width: 100%;
            height: 130px;
            background: #76D0F3;
            position: absolute;
            bottom: 0px;
            box-sizing: border-box;
            /* 考虑安全区域 */
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        #controls {
            width: 100%;
            height: 50px;
            position: absolute;
            background: #66C0D3;
            bottom: 0px;
            box-sizing: border-box;
        }
        
        #weight {
            width: 100%;
            height: 75px;
            text-align: center;
            font-size: 52px;
            color: white;
            line-height: 75px;
            top: 0px;
            position: absolute;
            box-sizing: border-box;
        }
        
        #tare {
            background: #6EDB4E;
            color: white;
            text-align: center;
            width: 50%;
            font-size: 24px;
            line-height: 50px;
            height: 50px;
            left: 0px;
            position: absolute;
            cursor: pointer;
            box-sizing: border-box;
        }
        
        select {
            width: 40%;
            position: absolute;
            right: 20px;
            height: 25px;
            -webkit-appearance: none;
            bottom: 5px;
            display: block;
            padding-right: 15px;
            background: no-repeat 95% #fff;
            border: none;
            outline: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            padding: 0px 5px;
            box-sizing: border-box;
        }
        
        #label {
            position: absolute;
            left: 50%;
            font-size: 12px;
            width: 50%;
            top: 0px;
            text-align: center;
            top: 4px;
            color: white;
            box-sizing: border-box;
        }
        
        a, a:hover, a:active, a:visited {
            color: white;
        }
        
        #logo {
            height: 30px;
            width: 150px;
            text-align: center;
            line-height: 30px;
            border-bottom-left-radius: 5px;
            border-bottom-right-radius: 5px;
            position: absolute;
            top: 0px;
            left: 0px;
            right: 0px;
            margin: auto;
            color: white;
            background: #76D0F3;
            box-sizing: border-box;
        }
        
        #circle {
            width: calc(100% - 40px);
            height: calc(100% - 200px);
            position: absolute;
            bottom: 145px;
            top: 45px;
            left: 0px;
            right: 0px;
            margin: auto;
            border: 4px dashed #ddd;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            background-color: white;
            max-width: 350px;
            max-height: 350px;
            min-width: 200px;
            min-height: 200px;
            box-sizing: border-box;
        }
        
        #circle2 {
            position: absolute;
            border-radius: 50%;
            background: #F8E14B;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            margin: auto;
            width: 0px;
            height: 0px;
            opacity: 0.8;
            box-sizing: border-box;
        }
        
        #message {
            height: 100px;
            width: 90%;
            text-align: center;
            position: absolute;
            top: 0px;
            left: 0px;
            bottom: 0px;
            right: 0px;
            margin: auto;
            font-size: 12px;
            color: #777;
            box-sizing: border-box;
        }
        
        @keyframes fade {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        #warning {
            position: absolute;
            width: 100%;
            height: 40px;
            color: darkred;
            font-weight: bold;
            text-align: center;
            bottom: 5px;
            left: 0;
            right: 0;
            margin: auto;
            display: none;
            -webkit-animation: fade ease-in-out 0.5s;
            box-sizing: border-box;
        }
        
        /* 响应式设计 - 针对小屏幕设备 */
        @media (max-width: 414px) {
            #container {
                width: 100%;
                height: 100vh;
                max-width: 100%;
                border-top: 15px solid #76D0F3;
            }
            
            #circle {
                width: calc(100% - 30px);
                height: calc(100% - 180px);
                max-width: 300px;
                max-height: 300px;
            }
            
            #footer {
                height: 120px;
            }
            
            #weight {
                font-size: 42px;
                height: 65px;
                line-height: 65px;
            }
        }
        
        /* 针对iPhone 7/8 (375x667) 及类似尺寸设备 */
        @media (max-width: 375px) and (max-height: 667px) {
            #container {
                border-top: 12px solid #76D0F3;
                height: 100vh;
                /* 为iPhone底部安全区域预留空间 */
                padding-bottom: 20px;
            }
            
            #circle {
                width: calc(100% - 20px);
                height: calc(100% - 190px);
                max-width: 250px;
                max-height: 250px;
                top: 40px;
                bottom: 165px;
            }
            
            #footer {
                height: 130px;
            }
            
            #weight {
                font-size: 36px;
                height: 60px;
                line-height: 60px;
            }
            
            #tare {
                font-size: 20px;
                line-height: 45px;
                height: 45px;
            }
            
            #message {
                font-size: 10px;
                width: 95%;
            }
            
            #controls {
                height: 45px;
            }
        }
        
        /* 针对iPhone 7/8 (375x667) 竖屏模式优化 */
        @media screen and (min-width: 375px) and (max-width: 375px) and (min-height: 667px) and (max-height: 667px) {
            #container {
                border-top: 12px solid #76D0F3;
                height: 100vh;
                /* 为iPhone底部安全区域预留空间 */
                padding-bottom: 20px;
            }
            
            #circle {
                width: 250px;
                height: 250px;
                max-width: 250px;
                max-height: 250px;
                top: 40px;
                bottom: 165px;
            }
            
            #footer {
                height: 130px;
            }
            
            #weight {
                font-size: 36px;
                height: 60px;
                line-height: 60px;
            }
            
            #tare {
                font-size: 20px;
                line-height: 45px;
                height: 45px;
            }
            
            #message {
                font-size: 10px;
                width: 95%;
            }
            
            #controls {
                height: 45px;
            }
        }
        
        /* 针对超小屏幕设备 */
        @media (max-width: 360px) {
            #container {
                border-top: 12px solid #76D0F3;
                padding-bottom: 15px;
            }
            
            #circle {
                width: calc(100% - 20px);
                height: calc(100% - 185px);
                max-width: 240px;
                max-height: 240px;
                bottom: 160px;
            }
            
            #footer {
                height: 125px;
            }
            
            #weight {
                font-size: 36px;
                height: 60px;
                line-height: 60px;
            }
            
            #tare {
                font-size: 20px;
                line-height: 45px;
                height: 45px;
            }
            
            #message {
                font-size: 10px;
            }
        }
        
        /* 针对极小屏幕设备 */
        @media (max-width: 320px) {
            #container {
                border-top: 10px solid #76D0F3;
                padding-bottom: 10px;
            }
            
            #circle {
                width: calc(100% - 15px);
                height: calc(100% - 180px);
                max-width: 200px;
                max-height: 200px;
                bottom: 155px;
            }
            
            #footer {
                height: 120px;
            }
            
            #weight {
                font-size: 30px;
                height: 55px;
                line-height: 55px;
            }
            
            #tare {
                font-size: 18px;
                line-height: 40px;
                height: 40px;
            }
            
            #message {
                font-size: 9px;
            }
        }
        
        /* iPhone X 及更新机型的安全区域适配 */
        @supports (padding: env(safe-area-inset-bottom)) {
            #container {
                padding-bottom: env(safe-area-inset-bottom);
            }
            
            #footer {
                padding-bottom: env(safe-area-inset-bottom);
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="logo">屏幕<b>称重</b></div>
        <div id="circle">
            <div id="message">在屏幕上放置一些可传导电容的物品,例如苹果或橘子<br><b>请勿放置任何会划伤屏幕的东西</b><br>如果更改了3DTouch(三维触控)灵敏度,请在下面进行设置</div>
            <div id="circle2"></div>
            <div id="warning" style="display: none;">多点触控称重<br>(精确度不如单点高)</div>
        </div>
        <div id="footer">
            <div id="weight">0.00g</div>
            <div id="controls">
                <div id="tare">去皮</div>
                <select id="sense">
                    <option value="0">弱 / Light</option>
                    <option value="1" selected>中 / Medium</option>
                    <option value="2">强 / Firm</option>
                </select>
                <div id="label">3D Touch 灵敏度</div>
            </div>
        </div>
    </div>
    <script>
        var tare = document.getElementById('tare');
        var warning = document.getElementById('warning');
        var currentTouchF;
        
        function transformTare() {
            if (typeof currentTouchF == 'undefined') return;
            tare.style.webkitTransform = 'rotateX(' + currentTouchF.force * 60 + 'deg)'
        }
        
        setInterval(transformTare, 10);
        
        function tareTouchStart(e) {
            e.preventDefault();
            currentTouchF = e.touches[0];
            tareForce = e.touches[0].force
        }
        
        tare.addEventListener('touchstart', tareTouchStart, false);
        
        var weight = document.getElementById('weight');
        var forceConversions = [0.8, 1, 1.2];
        var fcIndex = 1;
        var tare = document.getElementById('tare');
        var circle2 = document.getElementById('circle2');
        var maxForce = 6.666666667;
        var tareForce = 0;
        var currentTouch;
        var updater = 0;
        var numTouches = 0;
        var touches = {};
        var force = 0;
        
        document.getElementById('sense').onchange = function(e) {
            fcIndex = this.selectedIndex;
            document.cookie = "fc=" + fcIndex;
        };
        
        var fcCookie = ('; ' + document.cookie).split('; fc=').pop().split(';').shift();
        fcIndex = fcCookie == "" ? fcIndex : +fcCookie;
        document.getElementById('sense').selectedIndex = fcIndex;
        
        function onForceStart(event) {
            currentTouch = event.touches[0];
            numTouches = event.touches.length
        }
        
        function onForceMove(event) {
            event.preventDefault();
            currentTouch = event.touches[0];
            numTouches = event.touches.length
        }
        
        function onForceEnded(event) {
            event.preventDefault();
            setTimeout(function() {
                currentTouch = undefined;
                force = 0;
                delete touches[event.changedTouches[0].identifier];
            }, 2);
            numTouches = event.touches.length
        }
        
        function onForceChange(event) {
            event.preventDefault();
            currentTouch = event.changedTouches[0];
            force = 0;
            for (var i = 0; i < event.changedTouches.length; i++) 
                touches[event.changedTouches[i].identifier] = event.changedTouches[i].force;
            numTouches = Object.keys(touches).length;
            for (var k in touches) 
                if (touches.hasOwnProperty(k)) {
                    force += touches[k]
                }
        }
        
        function weigh(force) {
            var tare = force - tareForce;
            var grams = (tare * 405.257 * forceConversions[fcIndex] + 2.056 * forceConversions[fcIndex]);
            if (grams < 12) grams -= 2.056 * forceConversions[fcIndex];
            return grams.toFixed(2);
        };
        
        function updateForce() {
            if (numTouches > 1) {
                warning.style.display = 'inline-block';
            } else {
                warning.style.display = 'none';
            }
            
            circle2.style.height = ((force / numTouches) * 345) + 'px';
            circle2.style.width = ((force / numTouches) * 345) + 'px';
            document.getElementById('container').style.webkitTransform = 'rotateX(' + force / numTouches * -20 + 'deg) scale(' + (1 - (force / numTouches * 0.06)) + ')';
            var px = force / numTouches * 5 + 'px';
            if (force > 0) document.body.style.boxShadow = '0px 0px ' + ' 15px ' + px + ' rgba(0, 0, 0, 0.333) inset';
            weight.innerHTML = weigh(force) + 'g';
        }
        
        setInterval(updateForce, 1);
        
        var circle = document.getElementById('circle');
        circle.addEventListener('touchmove', onForceMove, false);
        circle.addEventListener('touchstart', onForceStart, false);
        circle.addEventListener('touchend', onForceEnded, false);
        circle.addEventListener('touchforcechange', onForceChange, false);
    </script>
</body>
</html>
