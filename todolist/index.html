    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js').catch(error => {
            console.log('Service Worker 注册失败:', error);
          });
        });
      }
    </script>
