<!DOCTYPE html>
<html>

<head>
    <title>在线交流</title>
    <meta charset="UTF-8">
    <!-- 添加跨域访问 -->
    <meta http-equiv="Access-Control-Allow-Origin" content="*">
    <meta http-equiv="Access-Control-Allow-Methods" content="GET, POST, PUT, DELETE, OPTIONS">
    <meta http-equiv="Access-Control-Allow-Headers" content="Content-Type, Access-Control-Allow-Headers, Authorization, X-Requested-With">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 14px;
            background-color: #f0f0f0;
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            min-height: 100vh; /* 使容器至少占满整个视口高度 */
			position: relative; /* 需要将容器设置为相对定位，以便让底部的 input-container 参照其位置 */
        }

        .chat-item {
            display: flex;
            margin-bottom: 20px;
        }

        .chat-item .avatar {
            display: flex;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 10px;
            background-color: #ccc;
        }

        .chat-item .message {
            flex: 1;
            padding: 10px;
            background-color: #f0f0f0;
            border-radius: 10px;
        }

        .chat-item .message .nickname {
            word-wrap: break-word;
            font-weight: bold;
        }

        .chat-item .message .text {
            word-wrap: break-word;
        }

        .chat-item .message .time {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            text-align: right;
        }

        .chat-item .message.sent {
            background-color: #dcf8c6;
        }

        .chat-item .message.sent .time {
            text-align: right;
        }

        .input-container {
            display: flex;
			align-items: center;
			position: fixed;
			bottom: 0;
			left: 0;
			width: 100%;
			padding: 20px;
			background-color: #fff;
			box-shadow: 0 -2px 5px rgba(0,0,0,0.2); /* 添加一个底部阴影效果 */
			box-sizing: border-box;
        }

        .input-container input[type="text"] {
			flex: 1;
			padding: 10px;
			border: none;
			border-radius: 10px;
			background-color: #f0f0f0;
			margin-right: 10px;
			font-size: 14px;
			color: #333;
			box-shadow: 0 0 5px rgba(0,0,0,0.2);
		}
		.input-container button {
			padding: 10px 20px;
			border: none;
			border-radius: 10px;
			background-color: #07c160;
			color: #fff;
			font-size: 14px;
			cursor: pointer;
			box-shadow: 0 0 5px rgba(0,0,0,0.2);
		}
		.input-container input[type="file"] {
			display: none;
		}
		.input-container label {
            margin-right: 10px;
			padding: 10px 20px;
			border: none;
			border-radius: 10px;
			background-color: #f0f0f0;
			color: #333;
			font-size: 14px;
			cursor: pointer;
			box-shadow: 0 0 5px rgba(0,0,0,0.2);
		}
        /* bubble样式，100 * 100，悬浮右下角 */
        .bubble {
            position: fixed;
            right: 20px;
            bottom: 80px;
            width: 110px;
            width: 120px;
            background-color: #f0f0f0;
            border-radius: 5%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            display: block;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #666;
            cursor: pointer;
            z-index: 100;
        }
        /* toast样式 */
        .toast {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* display: flex; */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            border-radius: 10px;
            padding: 20px;
            z-index: 9999;
        }

        .toast-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .toast-icon img {
            width: 40px;
            height: 40px;
        }

        .toast-text {
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        
    </div>
    <div class="input-container">
        <input type="text" placeholder="请输入消息...">
        <label for="upload-image">+</label>
        <input type="file" id="upload-image" accept="image/*">
        <button>发送</button>
    </div>
    <!-- 创建class 为bubble 的DIV-->
    <div class="bubble"></div>
    <!-- 屏幕正中间最上层添加toast -->
    <div class="toast">
        <div class="toast-icon">
            <img src="./SVG/圆心.svg" alt="提示图标">
        </div>
        <div class="toast-text">
            正在加载...
        </div>
    </div>
</body>
<script type="module">
    //是否是登陆状态
    let isLogin = false;
    let ip = '0.0.0.0';
    let address = '未知';
    let userData = {};
    let serverip = '10.168.1.103'//'www.mjexhibition.com'
    //获取当前链接？后参数
    const params = new URLSearchParams(window.location.search);
    let code = '';
    if (params.get('code')) {
        code = params.get('code')
    }
    //接入微信登陆获取用户数据（头像，昵称，用户ID）
    if(code == ''){
        isLogin = false;
    }else{
        isLogin = true;
        
        getToken();
    }

    function getToken(){ 
        fetch('http://'+ serverip +':3000/wechat_login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                code: code
            })
        })
            .then(response => response.json())
            .then(data => {
                userData = data.data;
                // Do something with the response data
            })
            .catch(error => {
                // Handle any errors that occur during the request
        });
    }
    
    //使用GET方法通过https://api64.ipify.org获取用户ip
    function getIp() {
        return new Promise((resolve, reject) => {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://api64.ipify.org');
            xhr.send();
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        resolve(xhr.responseText);
                        // 通过https://gwgp-cekvddtwkob.n.bdcloudapi.com/ip/geo/v1/district?ip=获取用户地址
                        var xhr2 = new XMLHttpRequest();
                        xhr2.open('GET', 'https://gwgp-cekvddtwkob.n.bdcloudapi.com/ip/geo/v1/district?ip=' + xhr.responseText);
                        // xhr2.setRequestHeader('Content-Type', 'application/json');
                        // xhr2.setRequestHeader('X-Bce-Signature', 'bce-auth-v1/8e5b5b5b5b5b5b5b5b5b5b5b5b5b5b5b/2020-12-01T08:00:00Z/1800/host/4b5c6d7e8f9a0a1b2c3d4e5f6g7h8i9j');
                        xhr2.send();
                        xhr2.onreadystatechange = function () {
                            if (xhr2.readyState === 4) {
                                if (xhr2.status === 200) {
                                    address = JSON.parse(xhr2.responseText).data.prov;
                                    console.log(address);
                                    ip = xhr.responseText;
                                } else {
                                    console.log(xhr2.status);
                                    console.log(xhr2.responseText);
                                }
                            }
                        }

                    } else {
                        reject('获取ip失败');
                    }

                }
            }
        })
    }

    let moreBtn = document.createElement('label');
    //修改最后聊天记录底部空间，避免container内容被input-container遮挡
    function setContainerPaddingBottom() {
        var container = document.querySelector('.container');
        var inputContainer = document.querySelector('.input-container');
        container.style.paddingBottom = inputContainer.offsetHeight + 'px';
    }
    setContainerPaddingBottom();

    //container只滚动里面的内容，不滚动自身
    function setContainerScroll() {
        var container = document.querySelector('.container');
        container.style.overflow = 'auto';
    }
    setContainerScroll();

    //从服务器获取聊天记录
    function getChatHistory() {
        //发送ajax请求
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'http://'+serverip+':3000/getMessage');
        xhr.send();
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4 && xhr.status === 200) {
                var data = JSON.parse(xhr.responseText);
                // console.log(data);
                //将聊天记录渲染到页面上
                renderChatHistory(data.data.items);
            }
        }
    }
    getChatHistory();

    //将聊天记录渲染到页面chat-item里
    function renderChatHistory(data) {
        var container = document.querySelector('.container');
        var html = '';
        for (var i = 0; i < data.length; i++) {
            let item = data[i];
            //转换item.msgtime为时间
            item.display_time = formatDate(item.display_time);
            html += `
            <div class="chat-item">
                <div class="avatar"><img src=${item.avatar}></img></div>
                <div class="message ${item.isSelf ? 'sent' : ''}">
                    <div class="nickname">${item.author}</div>
                    <div class="text">${item.title}</div>
                    <div class="time">来自${item.type} ${item.display_time}</div>
                </div>
            </div>
            `;
        }

        container.innerHTML = html;
    }

    //时间戳转换为时间
    function formatDate(data) {
        let timestamp = data;
        // 判断timestamp长度大于10位，删除后面的毫秒数
        if (String(timestamp).length > 10) {
            timestamp = String(timestamp).slice(0, 10);
        }
        timestamp = timestamp * 1000;
        const date = new Date(timestamp);
        const year = date.getFullYear();
        const month = ("0" + (date.getMonth() + 1)).slice(-2);
        const day = ("0" + date.getDate()).slice(-2);
        const hours = ("0" + date.getHours()).slice(-2);
        const minutes = ("0" + date.getMinutes()).slice(-2);
        const seconds = ("0" + date.getSeconds()).slice(-2);
        const formattedDate = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        console.log(formattedDate);

        return formattedDate;
    }

    // addMoreBtn()
    //超过2的倍数条聊天记录，添加查看更多超链接按钮
    function addMoreBtn() {
        var container = document.querySelector('.container');
        var chatItems = document.querySelectorAll('.chat-item');
        if (chatItems.length > 2) {
            moreBtn.className = 'more-btn';
            moreBtn.href = 'javascript:;';
            moreBtn.style.display = 'inline-block';
            moreBtn.style.color = '#999';
            moreBtn.style.textAlign = 'center';
            moreBtn.translate = 'translate(50% 0)';
            moreBtn.style.width = '100%';
            moreBtn.innerText = '查看更多';
            
            container.appendChild(moreBtn);
            loadMoreChatHistory();
        }
    }

    //点击查看更多按钮，加载更多聊天记录
    function loadMoreChatHistory() {
        var container = document.querySelector('.container');
        var moreBtn = document.querySelector('.more-btn');
        moreBtn.onclick = function () {
            //修改moreBtn变为普通文本，显示正在加载中
            moreBtn.innerText = '正在加载中...';
            //发送ajax请求
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'http://' + serverip +':3000/getMessageMore');
            xhr.send();
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    console.log(data);
                    //如果data为空，说明没有更多聊天记录了，删除moreBtn
                    if (data.length === 0) {
                        container.removeChild(moreBtn);
                        return;
                    }
                    //将聊天记录渲染到页面上
                    renderChatHistory(data);
                    //超过10条聊天记录，添加查看更多按钮
                    addMoreBtn();
                }
            }
        }
    }
    let selectedFiles = [];
    let prewieImages = [];
    var bubble = document.querySelector('.bubble');

    var uploadImage = document.querySelector('#upload-image');
    // //uploadImage多选图片
    // uploadImage.setAttribute('multiple', 'multiple');
    //限定选择图片数量
    uploadImage.setAttribute('max', '1');
    // 监听change事件
    uploadImage.onchange = function () {
        console.log(this.files);
        if(this.files.length > 1){
            var toast = document.querySelector('.toast');
            toast.style.display = 'block';
            //修改toast的toast-icon内的img的图片
            toast.querySelector('.toast-icon img').src = './SVG/关闭.svg';
            //修改toast的toast-text的内容
            toast.querySelector('.toast-text').innerText = '最多只能上传一张图片';
            setTimeout(function () {
                toast.style.display = 'none';
            }, 1000);
        }
        bubble.innerHTML = '';
        //对所有选择的图片质量进行压缩
        for (var i = 0; i < this.files.length; i++) {
            var file = this.files[i];
            var reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (e) {
                const fileContent = reader.result;
                const fileType = file.type;
                const fileName = file.name;
                if (fileType !== 'image/jpeg' && fileType !== 'image/png') {
                    alert('只能上传 JPG 或 PNG 格式的图片');
                    return;
                }
                var img = new Image();
                img.src = e.target.result;
                img.onload = function () {
                    var canvas = document.createElement('canvas');
                    var ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    var base64 = canvas.toDataURL('image/jpeg', 0.5);
                    console.log(base64);

                    //生成预览图片
                    var previewImage = document.createElement('img');
                    previewImage.src = base64;
                    previewImage.style.width = '100px';
                    previewImage.style.height = '100px';
                    previewImage.style.margin = '10px';
                    previewImage.style.borderRadius = '10px';
                    previewImage.style.objectFit = 'cover';
                    previewImage.style.display = 'inline-block';
                    previewImage.style.verticalAlign = 'top';
                    previewImage.style.boxShadow = '0 0 10px #ccc';
                    prewieImages.push(previewImage);
                    //将预览图片添加到气泡中
                    bubble.appendChild(previewImage);

                    //将压缩后的图片添加到selectedFiles数组中
                    selectedFiles.push(base64);
                }
            }
        }
        //bubble右上角添加关闭按钮，点击关闭按钮，清空selectedFiles数组，隐藏气泡
        var closeBtn = document.createElement('span');
        closeBtn.innerText = 'x';
        closeBtn.style.position = 'absolute';
        // closeBtn 宽度高度相同
        closeBtn.style.width = '14px';
        closeBtn.style.height = '14px';
        closeBtn.style.top = '0';
        closeBtn.style.right = '0';
        closeBtn.style.padding = '5px';
        closeBtn.style.cursor = 'pointer';
        closeBtn.style.color = '#fff';
        closeBtn.style.background = '#000';
        closeBtn.style.borderRadius = '50%';
        closeBtn.style.fontSize = '12px';
        closeBtn.style.fontWeight = 'bold';
        closeBtn.style.lineHeight = '1';
        closeBtn.style.textAlign = 'center';
        closeBtn.style.textShadow = '0 -1px 0 rgba(0,0,0,.25)';
        closeBtn.style.opacity = '.5';
        closeBtn.style.filter = 'alpha(opacity=70)';
        closeBtn.style.transition = 'all .2s ease-in-out';
        closeBtn.onmouseover = function () {
            closeBtn.style.opacity = '1';
            closeBtn.style.filter = 'alpha(opacity=100)';
        }
        closeBtn.onmouseout = function () {
            closeBtn.style.opacity = '.5';
            closeBtn.style.filter = 'alpha(opacity=70)';
        }
        closeBtn.onclick = function () {
            selectedFiles = [];
            bubble.style.display = 'none';
        }
        bubble.appendChild(closeBtn);
        //如果没有图片，隐藏气泡
        bubble.style.display = this.files.length === 0 ? 'none' : 'block';
    }
    
    var input = document.querySelector('.input-container input');
    //监听input的点击事件
    input.onclick = function () {
        console.log('点击了input');
        // var toast = document.querySelector('.toast');
        // toast.style.display = 'block';

        //修改toast的toast-icon内的img的图片
        // toast.querySelector('.toast-icon img').src = './SVG/关闭.svg';
        //修改toast的toast-text的内容
        // toast.querySelector('.toast-text').innerText = '点击了input'+ isLogin;
        // setTimeout(function () {
        //     toast.style.display = 'none';
        // }, 1000);
        if(!isLogin){
            //如果没有登录，跳转到登录页面
            window.location.href = 'https://open.weixin.qq.com/connect/oauth2/authorize?appid=wx4499d900f68ce707&redirect_uri=http%3A%2F%2F10.168.1.103%2Fhz3d%2Fweb3d%2Fchat.html&response_type=code&scope=snsapi_userinfo&state=STATE&connect_redirect=1#wechat_redirect';
        }
    }
    sendMessage();
    //点击发送按钮，发送消息
    function sendMessage() {
        
        var button = document.querySelector('.input-container button');
        //发送选择的图片
        button.onclick = function () {
            //获取输入框的内容
            var text = input.value;
            var toast = document.querySelector('.toast');
            toast.style.display = 'block';
            // 如果没有输入内容，不发送，toast提示，1秒钟隐藏toast
            if (text === '') {
                //修改toast的toast-icon内的img的图片
                toast.querySelector('.toast-icon img').src = './SVG/关闭.svg';
                //修改toast的toast-text的内容
                toast.querySelector('.toast-text').innerText = '请输入内容';
                setTimeout(function () {
                    toast.style.display = 'none';
                }, 1000);
                return;
            }else{
                //如果有输入内容，发送消息
                //修改toast的toast-icon内的img的图片
                toast.querySelector('.toast-icon img').src = './SVG/loading.svg';
                //修改toast的toast-text的内容
                toast.querySelector('.toast-text').innerText = '正在发送...';
                
            }
            if(!isLogin){
                //修改toast的toast-icon内的img的图片
                toast.querySelector('.toast-icon img').src = './SVG/关闭.svg';
                //修改toast的toast-text的内容
                toast.querySelector('.toast-text').innerText = '发生错误，请重新登录';
                setTimeout(function () {
                    toast.style.display = 'none';
                }, 1000);
                return;
            }
            getIp();
            //发送ajax请求
            var xhr = new XMLHttpRequest();
            xhr.open('POST', 'http://' + serverip +':3000/addMessage');
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.send(JSON.stringify({
                visitorname: userData.name,
                visitorhead: userData.avatar,
                weid: userData.id,
                message: text,
                images: selectedFiles[0],
                visitorip: ip,
                address: address,
                msgtime: String(Date.now())
            }));
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    //清空输入框
                    input.value = '';
                    //清空selectedFiles数组
                    selectedFiles = [];
                    //隐藏气泡
                    bubble.style.display = 'none';
                    //清空气泡
                    bubble.innerHTML = '';
                    //清空预览图片数组
                    prewieImages = [];
                    //清空上传图片的input
                    uploadImage.value = '';
                    // 打印返回的数据
                    console.log((xhr.responseText));
                    //修改toast的toast-icon内的img的图片
                    toast.querySelector('.toast-icon img').src = './SVG/对勾.svg';
                    //修改toast的toast-text的内容
                    toast.querySelector('.toast-text').innerText = '发送成功';
                    setTimeout(function () {
                        toast.style.display = 'none';
                    }, 1000);
                }
            }
        }
    }
</script>
</html>
