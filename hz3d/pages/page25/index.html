　　徐伯昕事迹陈列馆位于湖塘镇晓柳二村北门晓柳社区居民委员会大楼一楼，面积80平米，陈列馆共有六个部分的展示：一是徐伯昕先生的生平。二是徐伯昕先生人生中最重要的四个阶段。三是树勋民进，展示了徐伯昕先生作为民进领导人，为民进事业所作的贡献；四是桑梓情深，展示了徐伯昕先生热爱常州，牵挂家乡，为常州捐献书籍，并把骨灰撒在家乡的运河里；五是回忆伯昕，主要展示各界人士追忆徐伯昕先生的文章；六是实物复制品展示，主要展示了徐伯昕先生身前使用过的物件和手稿。
            </p>
