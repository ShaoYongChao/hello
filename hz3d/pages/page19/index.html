 　　周建人历史资料陈列馆依托于绍兴鲁迅纪念馆，在全国重点文物保护单位——周家新台门（鲁迅故居）内布展。展览以时间为序，从“自学成才、投身教育”“传播科学、践行民主”“积极从政、赤诚为民”三个视角，结合照片、实物、绘画、雕塑、视频、互动等形式，立体反映周建人一生的思想发展轨迹，介绍周建人在传播科学、关心教育、支持革命、服务人民等方面的贡献。展览还展出了一批由周建人遗属捐赠的文物，包括衣物、用品、书刊等。
