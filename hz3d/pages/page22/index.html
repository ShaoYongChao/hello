            <p>
　冰心默庐原名“华氏墓庐”。1938年到1940年，民进先贤冰心与丈夫吴文藻携儿女在此处居住，从此与昆明结下了不解之缘，留下了默庐里的美好故事。冰心在此居住时，取“墓”之谐音，改名“默庐”。默庐于2003年5月被列为昆明市级文物保护单位，2018年列为云南省文物保护单位，2005年10月经揭顶修葺后面向社会全面开放。目前由昆明市呈贡区文物管理所负责管理维护，向社会公众免费对外开放，主体建筑保存完好，交通便利，默庐现已经被列为三台山旧城开发改造片区的重要人文旅游景点，周边环境将会得到进一步改善。
            </p>
