　　同心苑·雷洁琼祖居位于台山市大江镇锦龙村，它由雷洁琼祖居、同心苑主厅、偏厅、公共长廊、广场等部分组成。其中雷洁琼祖居于2018年重新修缮，面积约180平方米，室内图片展分一、二楼两个展厅，共收录了雷洁琼先生各个历史时期100多张珍贵照片。同心苑坐落在雷洁琼祖居旁，占地面积728 m2。其中首层雷洁琼纪念展厅面积 140.28平方米，二层面积为178.56平方米，首层偏厅75.08平方米；同心苑内展示了《雷洁琼生平事迹展》。
