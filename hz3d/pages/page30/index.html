　　北京民进会史馆位于北京市党派团体大楼民进北京市委办公区内，于2020年9月10日投入使用。馆内常设北京民进70年历史展览，通过7块图文展板、1块投影屏幕、荣誉墙、马叙伦等民进领导人珍贵手稿和历史档案等，展示“民进北京市委简介及组织发展历程”“民进北京市委历代领导”“北京民进‘言’”“北京民进‘事’”“不忘合作初心 继续携手前进”“新时代 新作为 新面貌”6大主题内容。同时，结合《北京民进先贤录》系列会史文集的编纂工作，适时增设临时展览，展示北京民进先贤生平事迹。
