　　柯灵故居位于上海市徐汇区复兴西路147号，是中国文坛大师柯灵的故居。柯灵原名高季琳，中国著名散文家、杂文家、编辑家和剧作家，中国民主促进会创始人之一，曾任民进中央名誉副主席、国际笔会上海中心会长等职。故居建于1933年，建筑面积约192平方米，为西班牙式风格的公寓住宅。一层布置为柯灵生平展厅及书信展厅；二层复原为柯灵居住时的原貌；花园中矗立有柯灵胸像。故居展陈的柯灵先生的书信、手稿、札记、日常生活用品等遗物，完整再现了柯灵先生当年的工作环境，反映了柯灵先生在此居住半个世纪的生活与文学创作历程。
            </p>
