        <div>
            <p>
           位于哈尔滨市道里区中央大街89号，1906年建成。1948年5月，毛主席在致李济深、沈钧儒的信中，明确表示召开政治协商会议的地点在哈尔滨，在筹备新政协的过程中，哈尔滨是最重要的民主人士聚集地，具体地点就在马迭尔。就这样，被赞誉为“东方凡尔赛宫”的马迭尔旅馆，从此开始见证中国新政治协商会议筹备的历史瞬间。1948年10月，王绍鏊由香港来到哈尔滨就住在这里。中共中央代表，时常到马迭尔拜访这些民主人士，商议国家大事。后来，马叙伦、郑振铎等人也曾在这里居住。
           </p>
