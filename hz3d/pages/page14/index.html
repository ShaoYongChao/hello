　岳云中学位于湖南衡阳。岳云中学是近代著名教育家、湖南民进主要创始人何炳麟先生倾毕生精力创办的一所百年名校。学校坐落在南岳衡山南麓，其址为宋明时期文定、白沙、紫云三大书院故址，属湖湘学派发祥地之一，人文传统源远流长。校内苍松翠柏掩映如画，碑亭楼阁错落有致，为青少年求学修身之佳境。中共湖南省委统战部将南岳岳云中学确立为湖南省各民主党派政治交接学习教育基地，2009年4月28日，在岳云中学举行了湖南省各民主党派政治交接学习教育基地揭牌仪式。
            </p>
