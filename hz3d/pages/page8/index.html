            <p>
　  位于福建省福州市鼓楼区杨桥路86号， 也是辛亥革命烈士林觉民的故居 。冰心(林觉民)故居占地面积614平方米，馆内原陈列福州辛亥革命史料。2004年11月，福州市委、市政府决定在林觉民故居里恢复冰心故居，同时把原来位于这里的“辛亥革命纪念馆”迁到辛亥革命福州前敌总指挥部旧址——— 于山大士殿。辛亥革命烈士林觉民的故居，现在则专作为展览林觉民和冰心两位名人的展览馆。1996年，福建省人民政府公布为第四批省级文物保护单位。
            </p>
