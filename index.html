<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hello</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      user-select: none;
      margin: 0;
      min-height: 100vh;
      font-family: 'Arial', sans-serif;
      color: white;
      overflow-x: hidden;
      position: relative;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .bg-image {
      position: fixed;
      z-index: -1;
      background-image: url("IMG_0822.jpeg");
      height: 100%;
      width: 100%;
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      filter: blur(3px);
      opacity: 0.3;
    }

    .header {
      text-align: center;
      padding: 2rem 0;
      position: relative;
      z-index: 10;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      animation: breathe 3s ease-in-out infinite;
      height: 4rem;
      line-height: 4rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .subtitle {
      font-size: 1.2rem;
      opacity: 0.9;
      margin-bottom: 2rem;
      height: 2rem;
      line-height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      position: relative;
      z-index: 10;
    }

    .menu-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 2rem;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
      text-decoration: none;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .menu-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      transition: left 0.5s;
    }

    .menu-card:hover::before {
      left: 100%;
    }

    .menu-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      background: rgba(255, 255, 255, 0.15);
    }

    .card-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      display: block;
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .card-description {
      font-size: 1rem;
      opacity: 0.8;
      line-height: 1.4;
    }

    .card-ps { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .card-mind { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
    .card-todo { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
    .card-iwork { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
    .card-video3d { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
    .card-web3d { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); }
    .card-countdown { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }

    #rainbow {
      position: fixed;
      font-size: 1rem;
      pointer-events: none;
      z-index: 1000;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #ffeaa7, #dda0dd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: rainbow 2s linear infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    @keyframes rainbow {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    @media (max-width: 768px) {
      .menu-container {
        grid-template-columns: 1fr;
        padding: 1rem;
      }
      
      h1 {
        font-size: 2rem;
      }
      
      .menu-card {
        padding: 1.5rem;
      }
    }

    .footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
   <script>
    var languages = ["English", "中文", "Français", "日本語", "한국어"];
    var currentLanguageIndex = 0;
     function changeLanguage() {
      var helloText = document.getElementById("hello-text");
      currentLanguageIndex = (currentLanguageIndex + 1) % languages.length;
       switch(languages[currentLanguageIndex]) {
        case "中文":
          helloText.innerText = "你好";
          break;
        case "English":
          helloText.innerText = "Hello";
          break;
        case "Français":
          helloText.innerText = "Bonjour";
          break;
        case "日本語":
          helloText.innerText = "こんにちは";
          break;
        case "한국어":
          helloText.innerText = "안녕하세요";
          break;
        default:
          break;
      }
      document.title = helloText.innerText;
    }
     setInterval(changeLanguage, 3000);
  </script>
</head>
<body>
  <div class="bg-image"></div>
  
  <div class="header">
    <h1 id="hello-text">Hello</h1>
    <div class="subtitle">Welcome</div>
  </div>

  <div class="menu-container">
    <a href="./PS-Online/" class="menu-card card-ps">
      <div class="card-icon">🎨</div>
      <div class="card-title">在线PS</div>
      <div class="card-description">强大的在线图片编辑工具，支持多种滤镜和编辑功能</div>
    </a>

    <a href="./mind/" class="menu-card card-mind">
      <div class="card-icon">🧠</div>
      <div class="card-title">思维导图</div>
      <div class="card-description">简洁易用的思维导图工具，帮助整理思路和知识结构</div>
    </a>

    <a href="./todolist/" class="menu-card card-todo">
      <div class="card-icon">✅</div>
      <div class="card-title">待办事项</div>
      <div class="card-description">简单高效的任务管理工具，让你的工作更有条理</div>
    </a>

    <a href="./iwork/" class="menu-card card-iwork">
      <div class="card-icon">🏛️</div>
      <div class="card-title">我爱工作</div>
      <div class="card-description">工作使我快乐</div>
    </a>

    <a href="./video3d/" class="menu-card card-video3d">
      <div class="card-icon">📹</div>
      <div class="card-title">全景视频</div>
      <div class="card-description">360度全景视频播放器，带来身临其境的观看体验</div>
    </a>

    <a href="./web3d/" class="menu-card card-web3d">
      <div class="card-icon">🌐</div>
      <div class="card-title">3D展厅</div>
      <div class="card-description">交互式3D虚拟展厅，探索数字化展示的无限可能</div>
    </a>

    <a href="./cd/" class="menu-card card-countdown">
      <div class="card-icon">⏰</div>
      <div class="card-title">下班倒计时</div>
      <div class="card-description">实用的下班倒计时工具，支持自定义时间和个性化设置</div>
    </a>
  </div>

  <div class="footer">
    <p>© 2024 工具集合 - 让创意无限延伸</p>
  </div>

  <p id="rainbow">Hello啊，树哥！</p>
  <script>

    var rainbow = document.getElementById("rainbow");

    // 给文档添加鼠标移动事件的监听器
    document.addEventListener("mousemove", function(e) {
      // 获取鼠标的位置
      var x = e.clientX;
      var y = e.clientY;

      // 设置文字的位置为鼠标的位置
      rainbow.style.left = x + "px";
      rainbow.style.top = y + "px";
    });
  </script>
</body>
 </html>
